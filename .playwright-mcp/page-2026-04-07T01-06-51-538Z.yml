      - heading "El Problema (Código Antiguo)" [level=3] [ref=e81]
      - generic [ref=e82]: "// ❌ ANTES: Usaba el valor específico de la etapa coordinator.setOnProgress((state) => { // state.changesApplied = 0 cuando inicia una etapa const message = `Ventas recientes: ${state.changesApplied} registros`; // Resultado: \"Ventas recientes: 0 registros\" 😵 });"
      - heading "La Solución (Código Actual)" [level=3] [ref=e83]
      - generic [ref=e84]: "// ✅ AHORA: Acumula el total de TODAS las etapas let totalChanges = 0; // Total acumulado const stageTotals = new Map<SyncStage, number>(); coordinator.setOnProgress((state) => { // Calcula cuántos registros NUEVOS llegaron en este callback const previous = stageTotals.get(state.stage) || 0; const newChanges = state.changesApplied - previous; if (newChanges > 0) { totalChanges += newChanges; // Acumula! } stageTotals.set(state.stage, state.changesApplied); // Usa el TOTAL acumulado, no solo el de esta etapa const message = `Ventas recientes: ${totalChanges} registros cargados`; // Resultado: \"Ventas recientes: 738 registros cargados\" ✅ });"
