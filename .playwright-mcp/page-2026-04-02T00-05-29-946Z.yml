          - heading "PGlite (PostgreSQL en WASM)" [level=4] [ref=e205]
          - paragraph [ref=e206]: Base de datos PostgreSQL completa que corre en el navegador usando WebAssembly. Persiste en IndexedDB, permite transacciones SQL completas y mantiene el esquema idéntico al servidor.
        - generic [ref=e207]:
          - img [ref=e209]
          - heading "Push Sync (Client → Server)" [level=4] [ref=e212]
          - paragraph [ref=e213]: Cola de operaciones pendientes que se sincronizan con el servidor en lotes (batches). Cada operación pasa por validación, detección de conflictos y procesamiento transaccional.
        - generic [ref=e214]:
          - img [ref=e216]
          - heading "Pull Sync (Server → Client)" [level=4] [ref=e220]
          - paragraph [ref=e221]: Sistema de cursor-based sync que trae solo los cambios desde la última sincronización. Usa paginación (100 registros por request) para manejar grandes volúmenes de datos.
        - generic [ref=e222]:
          - img [ref=e224]
          - heading "Conflict Resolution" [level=4] [ref=e228]
          - paragraph [ref=e229]:
            - text: Sistema de detección de conflictos basado en versiones. Cada entidad tiene un campo
            - code [ref=e230]: version
            - text: que incrementa con cada cambio. Si hay discrepancia, se detecta el conflicto y se puede aplicar estrategia "last-write-wins" o merge manual.
