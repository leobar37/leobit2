                - generic [ref=e744]:
                  - heading "What's Drizzle?" [level=3] [ref=e745]
                  - 'link "Permalink: What''s Drizzle?" [ref=e746] [cursor=pointer]':
                    - /url: "#whats-drizzle"
                    - img [ref=e747]
                - paragraph [ref=e749]:
                  - text: Drizzle is a modern TypeScript ORM developers
                  - link "wanna use in their next project" [ref=e750] [cursor=pointer]:
                    - /url: https://stateofdb.com/tools/drizzle
                  - text: . It is
                  - link "lightweight" [ref=e751] [cursor=pointer]:
                    - /url: https://bundlephobia.com/package/drizzle-orm
                  - text: at only ~7.4kb minified+gzipped, and it's tree shakeable with exactly 0 dependencies.
                - paragraph [ref=e752]:
                  - strong [ref=e753]: Drizzle supports every PostgreSQL, MySQL and SQLite database
                  - text: ", including serverless ones like"
                  - link "Turso" [ref=e754] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-sqlite#turso
                  - text: ","
                  - link "Neon" [ref=e755] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-postgresql#neon
                  - text: ","
                  - link "Xata" [ref=e756] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/connect-xata
                  - text: ","
                  - link "PlanetScale" [ref=e757] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-mysql#planetscale
                  - text: ","
                  - link "Cloudflare D1" [ref=e758] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-sqlite#cloudflare-d1
                  - text: ","
                  - link "FlyIO LiteFS" [ref=e759] [cursor=pointer]:
                    - /url: https://fly.io/docs/litefs/
                  - text: ","
                  - link "Vercel Postgres" [ref=e760] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-postgresql#vercel-postgres
                  - text: ","
                  - link "Supabase" [ref=e761] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-postgresql#supabase
                  - text: and
                  - link "AWS Data API" [ref=e762] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/get-started-postgresql#aws-data-api
                  - text: . No bells and whistles, no Rust binaries, no serverless adapters, everything just works out of the box.
                - paragraph [ref=e763]:
                  - strong [ref=e764]: Drizzle is serverless-ready by design
                  - text: . It works in every major JavaScript runtime like NodeJS, Bun, Deno, Cloudflare Workers, Supabase functions, any Edge runtime, and even in browsers.
                  - text: With Drizzle you can be
                  - link "fast out of the box" [ref=e765] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/benchmarks
                    - strong [ref=e766]: fast out of the box
                  - text: and save time and costs while never introducing any data proxies into your infrastructure.
                - paragraph [ref=e767]:
                  - text: While you can use Drizzle as a JavaScript library, it shines with TypeScript. It lets you
                  - link "declare SQL schemas" [ref=e768] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/sql-schema-declaration
                    - strong [ref=e769]: declare SQL schemas
                  - text: and build both
                  - link "relational" [ref=e770] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/rqb
                    - strong [ref=e771]: relational
                  - text: and
                  - link "SQL-like queries" [ref=e772] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/docs/select
                    - strong [ref=e773]: SQL-like queries
                  - text: ", while keeping the balance between type-safety and extensibility for toolmakers to build on top."
                - generic [ref=e774]:
                  - heading "Ecosystem" [level=3] [ref=e775]
                  - 'link "Permalink: Ecosystem" [ref=e776] [cursor=pointer]':
                    - /url: "#ecosystem"
                    - img [ref=e777]
                - paragraph [ref=e779]: While Drizzle ORM remains a thin typed layer on top of SQL, we made a set of tools for people to have best possible developer experience.
                - paragraph [ref=e780]:
                  - text: Drizzle comes with a powerful
                  - link "Drizzle Kit" [ref=e781] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/kit-docs/overview
                    - strong [ref=e782]: Drizzle Kit
                  - text: CLI companion for you to have hassle-free migrations. It can generate SQL migration files for you or apply schema changes directly to the database.
                - paragraph [ref=e783]:
                  - text: We also have
                  - link "Drizzle Studio" [ref=e784] [cursor=pointer]:
                    - /url: https://orm.drizzle.team/drizzle-studio/overview
                    - strong [ref=e785]: Drizzle Studio
                  - text: for you to effortlessly browse and manipulate data in your database of choice.
