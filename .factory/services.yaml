commands:
  install: cd packages/app && npm install
  typecheck: cd packages/app && npm run typecheck
  build: cd packages/app && npm run build
  test: cd packages/app && npm test
  lint: cd packages/app && npm run lint
  dev: cd packages/app && npm run dev

devServer:
  start: cd packages/app && npm run dev
  port: 5173
  healthcheck: curl -sf http://localhost:5173

test:
  unit: cd packages/app && npm test
  integration: cd packages/app && npm run test:integration
