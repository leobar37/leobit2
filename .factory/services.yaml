commands:
  install: bun install
  typecheck: cd packages/backend && bun run typecheck && cd ../app && bun run typecheck
  build: bun run build
  test: cd packages/backend && bun test --run && cd ../app && bun test --run
  lint: cd packages/app && bun run lint
  sync:generate: cd packages/backend && bun run sync:generate
  sync:validate: cd packages/backend && bun run sync:validate

services:
  backend-dev:
    start: cd packages/backend && bun run dev
    stop: lsof -ti :3000 | xargs kill
    healthcheck: curl -sf http://localhost:3000/health
    port: 3000
    depends_on: []

  app-dev:
    start: cd packages/app && bun run dev
    stop: lsof -ti :5173 | xargs kill
    healthcheck: curl -sf http://localhost:5173
    port: 5173
    depends_on: []
