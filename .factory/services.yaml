commands:
  install: bun install
  typecheck: turbo run typecheck
  build: turbo run build
  test: turbo run test
  lint: turbo run lint

services:
  postgres:
    start: docker compose up -d postgres
    stop: docker compose stop postgres
    healthcheck: pg_isready -h localhost -p 5432
    port: 5432
    depends_on: []

  backend:
    start: cd packages/backend && PORT=3100 bun run dev
    stop: lsof -ti :3100 | xargs kill
    healthcheck: curl -sf http://localhost:3100/health
    port: 3100
    depends_on: [postgres]

  app:
    start: cd packages/app && PORT=3101 bun run dev
    stop: lsof -ti :3101 | xargs kill
    healthcheck: curl -sf http://localhost:3101
    port: 3101
    depends_on: [backend]
