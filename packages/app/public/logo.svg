<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#routeGradient)"/>

  <!-- Route path -->
  <path d="M120 300 Q 180 150, 256 200 T 392 280"
        stroke="white"
        stroke-width="24"
        fill="none"
        stroke-linecap="round"/>

  <!-- Route points -->
  <circle cx="120" cy="300" r="20" fill="white"/>
  <circle cx="256" cy="200" r="16" fill="white"/>
  <circle cx="392" cy="280" r="20" fill="white"/>

  <!-- Moving indicator (small dot showing direction) -->
  <circle cx="392" cy="280" r="8" fill="#f97316"/>
</svg>
