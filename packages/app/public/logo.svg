<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Chicken icon - simple stylized design -->
  <g fill="#ffffff" transform="translate(256, 256) scale(0.8)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="90" ry="70"/>
    
    <!-- Head -->
    <circle cx="50" cy="-30" r="45"/>
    
    <!-- Comb (red part on head) - using lighter orange -->
    <path fill="#fed7aa" d="M 35,-65 Q 50,-85 65,-65 Q 80,-75 85,-55 Q 70,-50 65,-40 Q 50,-50 35,-40 Z"/>
    
    <!-- Beak -->
    <path fill="#fbbf24" d="M 85,-25 L 105,-15 L 85,-5 Z"/>
    
    <!-- Eye -->
    <circle cx="65" cy="-35" r="6" fill="#1f2937"/>
    <circle cx="67" cy="-37" r="2" fill="#ffffff"/>
    
    <!-- Wing -->
    <ellipse cx="-10" cy="30" rx="35" ry="25" fill="#f97316" opacity="0.3"/>
    
    <!-- Legs -->
    <line x1="-20" y1="85" x2="-20" y2="110" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="85" x2="20" y2="110" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Feet -->
    <path fill="#fbbf24" d="M -20,110 L -30,120 M -20,110 L -20,122 M -20,110 L -10,120"/>
    <path fill="#fbbf24" d="M 20,110 L 10,120 M 20,110 L 20,122 M 20,110 L 30,120"/>
  </g>
</svg>