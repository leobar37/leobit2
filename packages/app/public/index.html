<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="Sistema de ventas de pollo - Offline first" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Avileo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
      .loading { text-align: center; color: white; }
      .loading-mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12); }
      .loading-spinner { width: 28px; height: 28px; border-radius: 999px; border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: white; animation: spin 0.8s linear infinite; }
      .loading-title { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
      .loading-text { font-size: 16px; opacity: 0.9; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-mark" aria-hidden="true">
          <div class="loading-spinner"></div>
        </div>
        <div class="loading-title">Avileo</div>
        <div class="loading-text">Cargando...</div>
      </div>
    </div>
  </body>
</html>
