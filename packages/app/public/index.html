<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#f97316" />
    <meta name="description" content="Sistema de ventas de pollo - Offline first" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Avileo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
      .loading { text-align: center; color: white; }
      .loading-icon { font-size: 64px; margin-bottom: 16px; }
      .loading-title { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
      .loading-text { font-size: 16px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="loading-icon">🐔</div>
        <div class="loading-title">Avileo</div>
        <div class="loading-text">Cargando...</div>
      </div>
    </div>
  </body>
</html>
